<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Construção | Tiago Silva</title>
    
    <!-- Fonte Google Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1f1f1f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            animation: fadeIn 0.8s ease-in-out;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 700;
            color: #1f1f1f;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .title span {
            color: #6C5CE7;
        }

        .illustration-container {
            position: relative;
            width: 320px;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .construction-img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .description {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 480px;
        }

        .btn-home {
            background-color: #6C5CE7;
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(108, 92, 231, 0.35);
            transition: all 0.3s ease;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-home:hover {
            background-color: #5b4bc4;
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(108, 92, 231, 0.45);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .title {
                font-size: 2.1rem;
            }
            .description {
                font-size: 0.98rem;
            }
            .illustration-container {
                width: 260px;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <h1 class="title">EM <span>CONSTRUÇÃO</span></h1>

        <div class="illustration-container">
            <!-- Imagem local carregada da mesma pasta -->
            <img src="construcao.png" alt="Em Construção" class="construction-img">
        </div>

        <p class="description">
            Estou preparando algo incrível para esta seção! Em breve você poderá conferir todos os detalhes por aqui.
        </p>

        <a href="index.html" class="btn-home">
            &larr; Voltar para o Início
        </a>
    </main>

</body>
</html>
