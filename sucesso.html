<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Enviada | Tiago Silva</title>
    
    <!-- Fonte Google Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fdfbf7;
            color: #1f1f1f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #ffffff;
            max-width: 550px;
            width: 100%;
            padding: 45px 30px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(108, 92, 231, 0.12);
            border: 1px solid rgba(108, 92, 231, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: fadeIn 0.8s ease-in-out;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: #f3f0ff;
            color: #6C5CE7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f1f1f;
        }

        .description {
            color: #666666;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .btn-home {
            background-color: #6C5CE7;
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(108, 92, 231, 0.35);
            transition: all 0.3s ease;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-home:hover {
            background-color: #5b4bc4;
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(108, 92, 231, 0.45);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="icon-circle">
            <i data-lucide="check-circle-2" style="width: 48px; height: 48px;"></i>
        </div>

        <h1 class="title">Mensagem Enviada!</h1>

        <p class="description">
            Obrigado pelo contato! Sua mensagem foi recebida com sucesso. Em breve entrarei em contato para conversarmos sobre a sua ideia.
        </p>

        <a href="index.html" class="btn-home">
            <i data-lucide="arrow-left"></i> Voltar ao Início
        </a>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
